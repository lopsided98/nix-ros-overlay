name: "Darwin"
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  eval:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31.8.1
    - run: maintainers/scripts/eval-darwin.sh
  build-ros-base:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - humble
          - jazzy
          - kilted
          - lyrical
          - rolling
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31.8.1
    - run: nix-build -A rosPackages.${{ matrix.distro }}.ros-base
